# AGE autonomy policy — the single declarative law file (02-rule-law §3).
# Mission: age-autonomy-implementation (paths resolve per mission context:
# {{plansDir}} / {{roadmapPath}}; this file is law data — changes only through
# a plan's Add item, never ad-hoc edits; P8 self-protection is WI21 scope).
#
# limits precedence: policy is authoritative, mission config (engine
# flow.maxAuditRounds) is the fallback — one authority + one fallback per
# constraint. maxAuditRounds here matches flows/mission-driver.json (3) so the
# two channels agree until consumers switch (M2/M3 plans). maxFailures is
# schema-reserved; default semantics land with M3/WI27.
version: 1
limits:
  maxAuditRounds: 3
  maxFailures: 3
gates:
  # Seed structural rule only (0815-1); the frontmatter-tightening enforce
  # flip belongs to the M2 path-guard plan (WI21) — stays observe.
  - id: plan-structure
    match: "{{plansDir}}/**/*.md"
    rule: plan-structure
    mode: observe
  # Three hard gates — direct enforce authorization (02 §6 exception clause:
  # post-P0 hard gates skip the observe ramp; P0 = the M1 ledger migration
  # closed with roadmap WI1–WI11 all ticked and 807 tests green). Decision
  # recorded in docs/plans/age-autonomy/2026-08-25-0815-2 Phase 3. Gate order
  # matters for deny-reason precedence: receipt binding denies (forged /
  # misbound receipts) before the completion formula denies.
  - id: closure-audit-binding
    match: "{{plansDir}}/**/*.md"
    rule: closure-audit-binding
    mode: enforce
  - id: roadmap-audit-binding
    match: "{{roadmapPath}}"
    rule: roadmap-audit-binding
    mode: enforce
  - id: writer-identity
    match: "{{plansDir}}/**/*.md"
    rule: writer-identity
    mode: enforce
  - id: plan-completed
    match: "{{plansDir}}/**/*.md"
    rule: plan-completed
    mode: enforce
triggers:
  # Execution semantics belong to M3/WI26 — schema-pinned syntax only.
  - when: "plan.full-tick and mechanical-verification-missing"
    dispatch: mechanical-verification
  - when: "plan.full-tick and mechanical-verification-pass and closure-receipt-missing"
    dispatch: closure-audit
  - when: "plan.status=draft and review-dispatch-missing"
    dispatch: plan-review
  - when: "plan.status=active and claim-expired"
    action: reclaim-claim
  - when: "terminal-claim=nothing-to-draft and draftPlans()==0 and activePlans()==0"
    dispatch: deep-audit
  - when: "deep-audit.accepted-findings=items"
    dispatch: draft-plans
  - when: "deep-audit.accepted-findings=none and draftPlans()==0 and activePlans()==0 and roadmap.unchecked"
    terminal: partial/blocked
agents:
  drafter:
    mode: pooled
    poolKey: "drafter:{projectRoot}"
    idleTtlMinutes: 30
    rotateEvery: 8
    model: { provider: zhipuai, model: glm-5.2, reasoningEffort: default }
  reviewer:
    mode: fresh
    model: { provider: zhipuai, model: glm-5.2, reasoningEffort: default }
  auditor:
    mode: fresh
    model: { provider: zhipuai, model: glm-5.2, reasoningEffort: high }
    requireDistinctModel: true
    # Explicit single-model deployment declaration (02 §4.9): this repo runs
    # executor and auditor on the same provider/model pair; the distinct-model
    # independence floor is consciously downgraded here instead of silently
    # unsatisfied. Runtime dispatch-time enforcement = M3/WI26.
    downgrade: single-model
  executor:
    mode: pooled
    poolKey: "executor:{projectRoot}"
    model: { provider: zhipuai, model: glm-5.2, reasoningEffort: default }
dispatch:
  plan-review: reviewer
  closure-audit: auditor
  deep-audit: auditor
  mechanical-verification: executor
  execute: executor
  draft-plans: drafter
