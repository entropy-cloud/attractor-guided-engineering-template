# AGE autonomy policy — the single declarative law file (02-rule-law §3).
# Mission: age-autonomy-implementation (paths resolve per mission context:
# {{plansDir}} / {{roadmapPath}} / {{projectRoot}}; this file is law data —
# changes only through a plan's Add item, never ad-hoc edits; P8
# self-protection denies AI writes here except human / CI / approved-project
# — the WI21 plan itself is the active approved-project reference; the
# M5-WI47 plan 2026-08-27-2122-1 is the active reference for the
# maxAuditRounds budget correction below).
#
# limits are TWO deliberately separate counting domains for maxAuditRounds
# (M5-WI47, plan docs/plans/age-autonomy/2026-08-27-2122-1): this row (8) is
# the GLOBAL cross-run budget authority — the law face (audit-rounds-overflow
# via resolveMaxAuditRounds, policy-first dual source) enforces the roadmap
# frontmatter audit-rounds counter against it; flows/mission-driver.json
# maxAuditRounds (3) is the PER-RUN transient guard feeding the engine
# in-run round gate (engine reads per-run state only, never the global
# counter — 06 checklist G7). The two values are intentionally different;
# do NOT re-align them. maxFailures semantics landed with M3/WI27 (failure
# attribution buckets + circuit breaker, 02 §4.6; dual-source
# resolveMaxFailures in law-policy.mjs: this limits row authoritative /
# flows/mission-driver.json top-level maxFailures fallback / both absent
# default 3 — the two channels agree at 3/3).
# stagnationRounds landed with M3/WI30 (03-supervisor §7/§8 stagnation
# fingerprint + ping-pong detection): N consecutive heartbeat cycles with an
# unchanged ledger fingerprint AND zero holder activity trip the R4 circuit
# breaker. Wall-clock conversion: 30s heartbeat × 10 rounds ≈ 5 minutes —
# long AI steps (verify commands run up to 10min) are never false-killed;
# dual-source resolveStagnationRounds: this limits row authoritative /
# flows/mission-driver.json top-level stagnationRounds fallback / both
# absent default 10. 0 = detector OFF (R4 never evaluates).
version: 1
limits:
  maxAuditRounds: 8
  maxFailures: 3
  stagnationRounds: 10
gates:
  # Seed structural rule (0815-1) + the M2-WI21 increments: the work-item
  # registration face (composite-label grammar denies from the label alone;
  # registry reconciliation runs when ctx.roadmapText is injected — absent →
  # note, never a deny, 02 §2 unobservable-facts discipline) and the
  # frontmatter-tightening enforce flip this plan owns per the 0815-1
  # comment hand-off. Posture: enforce — narrow decidable facts (field-set
  # legality / counting-domain / label grammar), same ①②③ reasoning as the
  # 0815-3 Phase 1 ruling; corpus compatibility pinned by the truth table.
  - id: plan-structure
    match: "{{plansDir}}/**/*.md"
    rule: plan-structure
    mode: enforce
  # Three hard gates — direct enforce authorization (02 §6 exception clause:
  # post-P0 hard gates skip the observe ramp; P0 = the M1 ledger migration
  # closed with roadmap WI1–WI11 all ticked and 807 tests green). Decision
  # recorded in docs/plans/age-autonomy/2026-08-25-0815-2 Phase 3. Gate order
  # matters for deny-reason precedence: receipt binding denies (forged /
  # misbound receipts) before the completion formula denies.
  - id: closure-audit-binding
    match: "{{plansDir}}/**/*.md"
    rule: closure-audit-binding
    mode: enforce
  - id: roadmap-audit-binding
    match: "{{roadmapPath}}"
    rule: roadmap-audit-binding
    mode: enforce
  - id: writer-identity
    match: "{{plansDir}}/**/*.md"
    rule: writer-identity
    mode: enforce
  - id: plan-completed
    match: "{{plansDir}}/**/*.md"
    rule: plan-completed
    mode: enforce
  # Supporting gates (0815-3, M2-WI17..WI20) — direct-enforce posture ruling:
  # all four deny faces are narrow decidable facts (action-record content /
  # budget integer comparison / claim field writer & holder / verify key
  # enumeration) with no matcher ambiguity, so the 02 §6 observe-first ramp
  # (which guards against false-killing legitimate in-run edits) does not
  # apply; observe-mode would also be unequipped in M2 (the observation-loop
  # consumer is the M3 supervisor). Decision + rollback trigger recorded in
  # docs/plans/age-autonomy/2026-08-25-0815-3 Phase 1.
  - id: nothing-claim
    match: "action:terminal-claim"     # terminal claims are actions, not file paths (02 §3)
    rule: nothing-claim-guard
    mode: enforce
  - id: claim-taken
    match: "{{plansDir}}/**/*.md"
    rule: claim-validity
    mode: enforce
  - id: verify-keys
    match: "{{plansDir}}/**/*.md"
    rule: verify-keys
    mode: enforce
  - id: meter-guard
    match: "{{roadmapPath}}"           # roadmap frontmatter budget meter (02 §4.6)
    rule: audit-rounds-overflow
    mode: enforce
  # append-only: direct enforce per the 02 §6 exception clause (net-regression
  # guards; same authorization reference as the three hard gates, 0815-2
  # Phase 3). One rule, two match domains (plans + roadmap DAR section).
  - id: append-only-records
    match: "{{plansDir}}/**/*.md"
    rule: record-append-only
    mode: enforce
  - id: append-only-records-roadmap
    match: "{{roadmapPath}}"
    rule: record-append-only
    mode: enforce
  # Path & structure guardrails + P8 self-protection (M2-WI21, plan
  # docs/plans/age-autonomy/2026-08-25-0950-1). Posture: enforce — every deny
  # face is a narrow decidable fact (plansDir domain membership / registered-
  # line write-back shape / protected-path membership), no matcher ambiguity,
  # same reasoning as the 0815-3 Phase 1 ruling; the observe ramp guards
  # against judgment-call false kills these faces do not have.
  # law-self-protection is P8 — the ONLY unconditional adversarial face
  # (02 §2/§4.7): observe-mode would let the enforced rewrite the enforcer
  # during the ramp itself, so it registers enforce directly.
  - id: path-guardrail
    match: "action:write"                # plan-shaped .md writes, any location (02 §4.7)
    rule: path-guardrail
    mode: enforce
  - id: roadmap-write-guard
    match: "{{roadmapPath}}"
    rule: roadmap-write-guard
    mode: enforce
  - id: law-self-protection-law
    match: "{{projectRoot}}/plugin/nop-age/src/law/**"
    rule: law-self-protection
    mode: enforce
  - id: law-self-protection-policy
    match: "{{projectRoot}}/missions/autonomy.policy.yml"
    rule: law-self-protection
    mode: enforce
  - id: law-self-protection-plan-check
    match: "{{projectRoot}}/tools/mission-driver/src/plan-check.mjs"
    rule: law-self-protection
    mode: enforce
  - id: law-self-protection-gate-check
    match: "{{projectRoot}}/tools/mission-driver/src/gate-check.mjs"
    rule: law-self-protection
    mode: enforce
  # legacy-plan-freeze (M2-WI22, plan docs/plans/age-autonomy/2026-08-25-0950-2):
  # the retired dsh plan-status-gate's protection semantics, collected into
  # the law kernel. Posture: enforce — the deny face is a narrow decidable
  # fact (a legacy TERMINAL `> Plan Status:` line carried/rewritten/deleted
  # by an in-domain .md write, glyph tolerance inherited from the shared
  # PLAN_STATUS_RE), the exceptions are the P8 literal three legs, and the
  # 54-plan frozen legacy corpus has no in-run writer left to false-kill.
  - id: legacy-plan-freeze
    match: "action:write"                # plan-domain .md writes; the rule self-scopes via ctx.plansRoots
    rule: legacy-plan-freeze
    mode: enforce
triggers:
  # Execution semantics belong to M3/WI26 — schema-pinned syntax only.
  - when: "plan.full-tick and mechanical-verification-missing"
    dispatch: mechanical-verification
  - when: "plan.full-tick and mechanical-verification-pass and closure-receipt-missing"
    dispatch: closure-audit
  - when: "plan.status=draft and review-dispatch-missing"
    dispatch: plan-review
  - when: "plan.status=active and claim-expired"
    action: reclaim-claim
  - when: "terminal-claim=nothing-to-draft and draftPlans()==0 and activePlans()==0"
    dispatch: deep-audit
  - when: "deep-audit.accepted-findings=items"
    dispatch: draft-plans
  - when: "deep-audit.accepted-findings=none and draftPlans()==0 and activePlans()==0 and roadmap.unchecked"
    terminal: partial/blocked
agents:
  drafter:
    mode: pooled
    poolKey: "drafter:{projectRoot}"
    idleTtlMinutes: 30
    rotateEvery: 8
    # fixedPrefix charter (M4-WI33, plan docs/plans/age-autonomy/
    # 2026-08-27-0433-3 — the PromptAssembler consumption face, 04 §3/§5):
    # FRESH dispatches carry the persona text + the embedded context file
    # before the dynamic task block; CONTINUE followups send only the
    # dynamic delta + changed files (per-member hash ledger). Embedding
    # beats forced reads — the "read project-context completely" round
    # disappears from every drafter dispatch.
    fixedPrefix:
      - { kind: text, ref: "{{projectRoot}}/AGENTS.md" }
      - { kind: file, ref: "{{projectRoot}}/docs/context/project-context.md", maxFileBytes: 60000 }
      # context-profile block (M4-WI34, plan docs/plans/age-autonomy/
      # 2026-08-27-0558-1 — 04 §4): expands to the profile's top-N stable
      # files (docs/references/context-profile.json, project-owned; first
      # start seeds from the AGENTS.md Read This First list; run-terminal
      # mining updates it with debounce). topN default 5, DSL-overridable
      # per agent. P8 exception = this plan active (the 0433-3 precedent).
      - { kind: profile, ref: "{{projectRoot}}/docs/references/context-profile.json", topN: 5 }
    model: { provider: zhipuai, model: glm-5.2, reasoningEffort: default }
  # reviewer pooled (M4-WI32, plan docs/plans/age-autonomy/2026-08-27-0433-2
  # Phase 1 Decision): mirror the drafter precedent — same-group sequential
  # review reuses one reviewer session (04 §2.2 the group is the maximal
  # reuse granularity; cross-group always starts fresh). Anchoring-bias
  # residual backstopped by rotateEvery + the cross-group fresh start.
  reviewer:
    mode: pooled
    poolKey: "reviewer:{groupId}"
    idleTtlMinutes: 30
    rotateEvery: 8
    model: { provider: zhipuai, model: glm-5.2, reasoningEffort: default }
  auditor:
    mode: fresh
    model: { provider: zhipuai, model: glm-5.2, reasoningEffort: high }
    requireDistinctModel: true
    # Explicit single-model deployment declaration (02 §4.9): this repo runs
    # executor and auditor on the same provider/model pair; the distinct-model
    # independence floor is consciously downgraded here instead of silently
    # unsatisfied. Runtime dispatch-time enforcement = M3/WI26.
    downgrade: single-model
  executor:
    mode: pooled
    poolKey: "executor:{projectRoot}"
    model: { provider: zhipuai, model: glm-5.2, reasoningEffort: default }
dispatch:
  plan-review: reviewer
  closure-audit: auditor
  deep-audit: auditor
  mechanical-verification: executor
  execute: executor
  draft-plans: drafter
# assembly (M4-WI33, 04-efficiency §5): the PromptAssembler policy face —
# embedStamp template (default shape below; {hash8} = first 8 hex of
# sha256, algorithm source = computeBasisHash) + continueDelta (CONTINUE
# followups send the dynamic delta + changed-file resend only). Policy is
# an overlay: the promptsDir → missions/prompts/ → built-in prompt
# resolution chain is untouched (04 §7).
assembly:
  embedStamp: '<file path="{path}" hash="{hash8}">{content}</file>'
  continueDelta: true
