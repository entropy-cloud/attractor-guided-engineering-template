# plugin/nop-age/test/fixtures/preset.cordis.yml
# M4-WI14 preset-composition leg fixture (plan
# docs/plans/dsh-plugin/2026-08-23-2202-1-* Phase 3, D4 verification domain
# ②): the L4 e2e composition PLUS the host preset roster, in ONE tree — the
# P4 gate's literal claim surface ("preset + plugin compose without realm
# collision").
#
# Base = test/fixtures/e2e.cordis.yml (the WI10 L4 composition: real
# nop-age service row non-isolated for the e2e driver's root-realm
# route access — that by-design split is unchanged; real host mounts keep
# the isolate realm via cordis.patch.yml) PLUS one row:
#
#   - id: agent-presets / name: '@deepseek-ai/dsh-agent-presets'
#       The host roster service itself (host-plane row — presets are the
#       things barred from root-realm services, not the roster). Roots point
#       at the IN-REPO preset directory via DSH_PRESET_ROOT (absolute path
#       set by the driver; the roster resolves root paths against the
#       process cwd, so the driver owns the absolute form). includeUserRoot:
#       false keeps the gate hermetic (no host-user preset discovery).
#
# Known fixture-only artifact, accepted (fixture header records it): the
# agent-spine rows mount their own toolSkill/skill-filesystem dependency
# tree in the HOST layer while the AGE preset carries the same plugin names
# in the PRESET layer — layered registration shadows rather than collides
# (the real host carries these rows only on the agent plane; the duplication
# exists only in this dual-source fixture and does not affect any assertion
# face below).
#
# Credentials NEVER land in this file (stub model endpoint on 127.0.0.1,
# DEEPSEEK_BASE_URL from the driver env; keyless precedent).

- id: mdcontrol
  name: ../../src/service.ts
  config:
    assetsDir: ../../assets

- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: age
    roots:
      - path: !!js process.env.DSH_PRESET_ROOT ?? './preset'
        trust: system
    includeUserRoot: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 172800000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)

# Managed child-process groups for the bash executor (spawn/kill plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: 'You are a software engineering step executor. When a prompt states an output contract, follow it exactly.'
    workspaceContext: false
    skills:
      enabled: true
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.e2e-sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
