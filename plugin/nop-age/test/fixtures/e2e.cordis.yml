# plugin/nop-age/test/fixtures/e2e.cordis.yml
# L4 in-process e2e composition (dsh-plugin M2-WI10, plan
# docs/plans/dsh-plugin/2026-08-23-1621-2-mdcontrol-run-async-contract-e2e.md
# Phase 2 Decision — e2e entry = in-process real-cordis-runtime construction).
#
# Base = test/fixtures/harness.cordis.yml (the WI9 L3 16-row non-PTY
# composition) MINUS the sdk-jsonrpc-server row (no stdio protocol is served —
# the e2e driver lives in the SAME process and calls the routes directly),
# PLUS the nop-age service row:
#
#   - id: mdcontrol / name: ../../src/service.ts
#       RELATIVE module specifier — dsh-app-boot resolves relative entry names
#       against the config file's directory (lib/index.js `boot`: "Relative
#       entry names resolve against the config directory"), i.e.
#       plugin/nop-age/src/service.ts — the REAL service module, loaded through
#       the ambient module pipeline (Node >=23.6 type stripping; same form
#       the deepseek-harness repo itself uses for its .ts sources).
#   - mounted NON-isolated (no cordis:group wrapper): this fixture is owned
#       by the e2e driver process, so publishing `mdcontrol` at the root realm
#       is the point — `ctx.get('mdcontrol')` must resolve. The real host
#       mount keeps its isolate realm via cordis.patch.yml (unchanged).
#
# Credentials NEVER land in this file: the e2e points DEEPSEEK_BASE_URL at a
# local scripted stub model endpoint (keyless precedent) from the driver env.
#
# stdout discipline: this composition serves no protocol on stdout, but keep
# loggers minimal anyway (the e2e driver parses its own artifacts, not stdout).

- id: mdcontrol
  name: ../../src/service.ts
  config:
    assetsDir: ../../assets

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 172800000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)

# Managed child-process groups for the bash executor (spawn/kill plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: 'You are a software engineering step executor. When a prompt states an output contract, follow it exactly.'
    workspaceContext: false
    # WI12: skills enabled — agent-spine mounts SkillRegistry +
    # SkillFileSystem + toolSkill (its own dependency tree, base-bundle
    # form), giving the mdcontrol service a real ctx.skills to register the
    # three mission-control skills against (Phase 1 Decision 1). dshHome is
    # hermetic via the DSH_HOME env the e2e driver points at the scratch
    # root — no host-user skill discovery leaks into the gate.
    skills:
      enabled: true
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.e2e-sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
