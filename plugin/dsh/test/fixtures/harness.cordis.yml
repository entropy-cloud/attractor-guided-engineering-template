# plugin/dsh/test/fixtures/harness.cordis.yml
# L3 host-integration harness composition (dsh-plugin M2-WI9, plan
# docs/plans/dsh-plugin/2026-08-23-1621-1-l3-host-harness-sdk-server.md Phase 1).
#
# Serves @deepseek-ai/dsh-sdk-jsonrpc-server over stdio for
# plugin/dsh/scripts/host-harness.mjs. Started via the demo bin:
#   node_modules/.bin/dsh-jsonrpc-agent test/fixtures/harness.cordis.yml
#
# Composition provenance (Phase 1 Decision 1):
#   - Base = repo-root examples/jsonrpc-agent/cordis.yml of deepseek-harness
#     (the official unattended composition for exactly this server; its
#     keyless e2e proves it boots headless under piped stdio).
#   - PTY adjudication: the minimal sample's dsh-terminal (PTY) +
#     dsh-tool-bash-persistent + dsh-sandbox-policy/danger-full-access rows are
#     deliberately ABSENT — a PTY requires a POSIX terminal environment the
#     harness's piped-stdio spawn does not provide. The base composition's
#     non-PTY foreground dsh-bash-local rows are used instead.
#   - maxTokensAsSuccess pinned to false (official samples diverge: full
#     sample true via env-default, minimal sample false). Scope: deployment
#     mapping of subagent.finished.status only — root-session turn/end gating
#     is unaffected (server README §Config). false = conservative mapping.
#   - Deliberate deltas vs the official full sample: persona pinned (no env),
#     model catalog row pinned to DSH_MODEL (minimal-sample precedent), session
#     root default under .harness-sessions with compression: none (official
#     minimal-sample precedent; plain JSONL aids post-hoc audit), llm-deepseek
#     thinking/reasoningEffort rows omitted (adapter defaults; a verification
#     harness does not want max-effort reasoning).
#   - Credentials NEVER land in this file: DEEPSEEK_API_KEY /
#     DEEPSEEK_BASE_URL are consumed from the process environment by
#     dsh-llm-deepseek (apiKeyEnv default).
#
# stdout is the protocol channel: do NOT add a console logger or terminal UI
# here (server README "stdout is the protocol").

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 172800000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)

# Managed child-process groups for the bash executor (spawn/kill plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: 'You are a software engineering step executor. When a prompt states an output contract, follow it exactly.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.harness-sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
