# plugin/dsh/test/fixtures/e2e-continuous.cordis.yml
# L4 continuous-mode e2e composition (age-autonomy M3-WI28, plan
# docs/plans/age-autonomy/2026-08-26-1954-1 Phase 3).
#
# Base = test/fixtures/e2e.cordis.yml (the WI10/WI11/WI12 in-process real
# cordis composition) PLUS the supervisor row on the mission-control config:
#
#   supervisor.projectRoot  — the scratch root the watchdog supervises
#     (env DSH_E2E_CONTINUOUS_ROOT, prepared by scripts/e2e-continuous.mjs
#     BEFORE boot: the supervisor mounts at config-resolution time);
#   supervisor.heartbeatMs — fast tick (default 250ms) so queue advancement
#     and terminal closure are observable within the e2e timeout budget.
#
# Everything else is unchanged from e2e.cordis.yml: the REAL mission-control
# service module at the root realm (ctx.get('mdcontrol') must resolve), the
# real DSH agents face (the `subagent` row's registry — dispatch exits create
# real agent sessions), and a stubbed model endpoint the driver points
# DEEPSEEK_BASE_URL at (keyless 127.0.0.1 precedent; the dispatch LEDGER
# assertions never depend on the agent turn's model outcome).
#
# Credentials NEVER land in this file.

- id: mdcontrol
  name: ../../src/service.ts
  config:
    assetsDir: ../../assets
    supervisor:
      projectRoot: !!js process.env.DSH_E2E_CONTINUOUS_ROOT ?? './e2e-continuous-root-missing'
      heartbeatMs: !!js Number(process.env.DSH_E2E_HEARTBEAT_MS ?? 250)

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 172800000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)

# Managed child-process groups for the bash executor (spawn/kill plumbing).
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: 'You are a software engineering step executor. When a prompt states an output contract, follow it exactly.'
    workspaceContext: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.e2e-sessions'
    compression: none

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
